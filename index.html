<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicQR</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.0.7/build/qr-code-styling.min.js"></script>
  </head>
  <body>
    <div id="page-wrapper">
      <div class="page-main">
        <div class="title">
          <h1>PicQR</h1>
        </div>
        <div class="catchphrase">
          <span>Put QR on your Pic</span>
        </div>
        <p class="io">
          <span class="pictograms">
            <i class="fa-regular fa-image"></i>
          </span>
        </p>
        <div class="image-input">
          <input type="file" id="image-input" accept="image/*">
        </div>
        <i class="fa-solid fa-plus"></i>
        <p class="io">
          <span class="pictograms">URL</span>
        </p>
        <div class="url-input">
          <input type="text" id="url-input" placeholder="Enter URL">
          <button type="button" id="clear-url-btn" aria-label="URLをクリア">×</button>
        </div>
        <p class="io">
          <span class="pictograms">
            <i class="fa-solid fa-down-long"></i><br>
          </span>
        </p>
        <p class="io">
          <span class="pictograms">
            <i class="fa-regular fa-image"></i>
            with
            <i class="fa-solid fa-qrcode"></i>
          </span>
        </p>
        <div class="qr-color-section">
          <label for="qr-color">QR Color: </label>
          <input type="color" id="qr-color" value="#000000">
          <button type="button" id="auto-color-btn">Auto</button>
          <p class="color-warning" id="color-warning" style="display:none;">
            The color you selected has low contrast with the background (white), which may make it impossible to scan the QR.
          </p>
        </div>
        <div class="button">
          <button id="generate-qr-btn">Generate Pic with QR</button>
        </div>
        <div class="image-output">
          <canvas id="output-canvas" style="display:none;"></canvas>
          <img id="output-image" style="display:none;" alt="QRコード付き画像">
        </div>
        <div class="download-section" id="download-section" style="display: none;">
          <button id="download-btn">Save Pic</button>
        </div>
        <script src="app.js"></script>
        <div class="copyright">
          <p>
            ©︎ 2023-2026 Akihito Kimura
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
